version: 2

builds:
  - main: ./cmd/asyncapi-gen
    binary: asyncapi-gen
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The release and its notes are created by go-semantic-release;
# GoReleaser only attaches the binaries.
changelog:
  disable: true
release:
  mode: keep-existing
