asyncapi: 3.0.0
info:
  title: Validation
  version: 1.0.0
  description: Exercises every keyword the generated validator enforces.

servers:
  local:
    host: localhost:4222
    protocol: nats

channels:
  samples:
    address: samples
    messages:
      sample:
        payload:
          $ref: '#/components/schemas/Sample'

operations:
  publishSample:
    action: send
    channel:
      $ref: '#/channels/samples'

components:
  schemas:
    Sample:
      type: object
      additionalProperties: false
      maxProperties: 30
      properties:
        int: {type: integer, multipleOf: 3}
        dec: {type: number, multipleOf: 0.1, exclusiveMinimum: 0, exclusiveMaximum: 1}
        draft4: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 10, exclusiveMaximum: true}
        bool: {type: boolean}
        str: {type: string, minLength: 2, maxLength: 3}
        date: {type: string, format: date}
        time: {type: string, format: time}
        dateTime: {type: string, format: date-time}
        uuid: {type: string, format: uuid}
        email: {type: string, format: email}
        ipv4: {type: string, format: ipv4}
        ipv6: {type: string, format: ipv6}
        tags: {type: array, uniqueItems: true, minItems: 1, maxItems: 3}
        values: {enum: [1, 2.5, x, true, null, [1], {a: 1}]}
        constObject: {const: {a: [1, 2]}}
        constNull: {const: null}
        counts: {type: object, minProperties: 1, maxProperties: 2, additionalProperties: {type: integer}}
        anyOf: {anyOf: [{type: string}, {type: integer}]}
        oneOf: {oneOf: [{type: integer}, {type: number, minimum: 5}]}
        allOf: {allOf: [{type: string}, {minLength: 2}]}
        not: {not: {type: string}}
        ifThenElse: {if: {type: string}, then: {minLength: 3}, else: {type: integer}}
        tree: {$ref: '#/components/schemas/Tree'}
        a/b~c: {type: integer}
    Tree:
      type: object
      properties:
        value: {type: integer}
        children:
          type: array
          items:
            $ref: '#/components/schemas/Tree'
