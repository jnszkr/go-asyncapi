name: Release

# Every push to main is versioned from its Conventional Commits:
# fix → patch, feat → minor, "!" / BREAKING CHANGE → major (minor while < 1.0.0).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  lint:
    uses: ./.github/workflows/lint.yml

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # go.mod holds the minimum version; binaries use the current release.
          go-version: stable

      - id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true

      # The tag above is pushed with GITHUB_TOKEN, which does not trigger
      # other workflows, so binaries are built here.
      - if: steps.semrel.outputs.version != ''
        run: git fetch --tags --force
      - if: steps.semrel.outputs.version != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
